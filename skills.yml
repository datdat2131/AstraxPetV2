# Kỹ năng. Mỗi nguyên tố đúng 3 kỹ năng (slot 1-3): 1 = cơ bản, 2 = nâng cao, 3 = tuyệt kỹ.
# type: PROJECTILE | AOE_SELF | AOE_TARGET | STRIKE_TARGET | DASH | SHIELD | HEAL_AREA
# damage: sát thương gốc (cấp kỹ năng 1)   cooldown: giây   range/radius: block   duration: giây   power: sức mạnh riêng (khiên/hồi máu/lực lướt)
# per-level-bonus: +% hiệu quả mỗi cấp kỹ năng    upgrade-cost: điểm kỹ năng cho lần nâng đầu (lần sau nhân theo cấp hiện tại)
# particle: tên Particle (không cần dữ liệu thêm)   sound: key âm thanh vanilla
# effects (tùy chọn): burn-seconds, slow-seconds, slow-amplifier, freeze-ticks, root-seconds, knockback, lift, pull,
#   pierce, splash-damage-ratio, repeat, interval-ticks, delay-ticks, lightning-visual, hostile-only, heal-allies,
#   heal-others, undead-multiplier, resistance-seconds, resistance-amplifier, self-slow-amplifier, slow-falling-seconds
